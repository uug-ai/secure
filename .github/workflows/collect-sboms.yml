name: Collect organization SBOMs

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-organization-sboms
  cancel-in-progress: false

jobs:
  collect:
    name: Collect SPDX documents
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout secure repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Test collector
        run: GOWORK=off go test ./...

      - name: Collect organization SBOMs
        id: collect
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
        run: |
          summary=$(GOWORK=off go run ./cmd/collect-sboms \
            -organization uug-ai \
            -output sboms)
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
          {
            echo '## SBOM collection'
            echo
            echo '```json'
            echo "$summary"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit updated SBOMs
        env:
          COLLECTION_SUMMARY: ${{ steps.collect.outputs.summary }}
        run: |
          git config user.name 'uug-ai-security-bot'
          git config user.email 'security-bot@users.noreply.github.com'
          git add sboms
          if git diff --cached --quiet; then
            echo 'No SBOM changes detected.'
            exit 0
          fi
          git commit -m "chore(sbom): refresh organization inventory" \
            -m "$COLLECTION_SUMMARY"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [[ "$attempt" == '3' ]]; then
              break
            fi

            echo "Push rejected; rebasing onto the latest main (attempt $attempt of 3)."
            git fetch origin main
            git rebase -X theirs origin/main
          done

          echo 'Unable to push SBOM updates after 3 attempts.' >&2
          exit 1
